# PLACEHOLDER SECRET TEMPLATE -- DO NOT COMMIT REAL KEYS.
#
# Replace every CHANGE_ME value before applying, or (strongly preferred)
# manage this Secret with a dedicated tool instead of checking it in:
#   * External Secrets Operator / Vault / cloud secret manager
#   * Sealed Secrets (kubeseal)
#   * SOPS with age/KMS
#
# Keys:
#   api-keys.yaml        apiKeyRef name -> real upstream indexer API key, plus
#                        hydraApiKeys presented by clients (Sonarr/Radarr), plus
#                        nzbTokenSigningKey (>=32 chars) signing deterministic
#                        NZB download tokens. All three live inside this one
#                        file, so a single mounted Secret carries them.
#
# The Deployment mounts this at /config/api-keys.yaml (defaultMode 0400) and the
# app reads nzbTokenSigningKey from the mounted file -- no separate secretKeyRef
# env var is needed.
apiVersion: v1
kind: Secret
metadata:
  name: stateless-hydra-api-keys
  namespace: stateless-hydra
  labels:
    app.kubernetes.io/name: stateless-hydra
    app.kubernetes.io/component: config
type: Opaque
stringData:
  api-keys.yaml: |
    apiKeys:
      example_indexer_key: "CHANGE_ME"
      example_torznab_key: "CHANGE_ME"

    hydraApiKeys:
      - "CHANGE_ME"

    # CHANGE_ME: replace with a random >=32-character secret, e.g.
    #   openssl rand -hex 32
    # It signs deterministic NZB download tokens. Deliberately <32 chars so a
    # forgotten replacement fails fast on startup instead of booting with a
    # publicly known key.
    nzbTokenSigningKey: "CHANGE_ME_BEFORE_DEPLOY"
