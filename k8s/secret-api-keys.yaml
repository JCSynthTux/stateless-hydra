# PLACEHOLDER SECRET TEMPLATE -- DO NOT COMMIT REAL KEYS.
#
# Replace every CHANGE_ME value before applying, or (strongly preferred)
# manage this Secret with a dedicated tool instead of checking it in:
#   * External Secrets Operator / Vault / cloud secret manager
#   * Sealed Secrets (kubeseal)
#   * SOPS with age/KMS
#
# Keys:
#   apiKeys       apiKeyRef name -> real upstream indexer API key
#   hydraApiKeys  API keys that clients (Sonarr/Radarr) present to /api
#
# The Deployment mounts this at /config/api-keys.yaml (defaultMode 0400).
apiVersion: v1
kind: Secret
metadata:
  name: stateless-hydra-api-keys
  namespace: stateless-hydra
  labels:
    app.kubernetes.io/name: stateless-hydra
    app.kubernetes.io/component: config
type: Opaque
stringData:
  api-keys.yaml: |
    apiKeys:
      example_indexer_key: "CHANGE_ME"
      example_torznab_key: "CHANGE_ME"

    hydraApiKeys:
      - "CHANGE_ME"
