# PLACEHOLDER SECRET TEMPLATE -- DO NOT COMMIT REAL KEYS.
#
# Replace every CHANGE_ME value before applying, or (strongly preferred)
# manage this Secret with a dedicated tool instead of checking it in:
#   * External Secrets Operator / Vault / cloud secret manager
#   * Sealed Secrets (kubeseal)
#   * SOPS with age/KMS
#
# The placeholders below are deliberately unusable: startup refuses to boot
# while any of them is left in place, so a forgotten replacement can never
# expose a publicly known client API key. The gates run in this order:
#   1. apiKeys values (and hydraApiKeys entries) that are `CHANGE_ME` or start
#      with it are rejected as soon as the file is loaded.
#   2. nzbTokenSigningKey must be >=32 characters, checked after the app.yaml /
#      SH_NZB_TOKEN_SIGNING_KEY override is applied.
#   3. hydraApiKeys must contain at least one entry.
#
# Keys:
#   api-keys.yaml        apiKeyRef name -> real upstream indexer API key, plus
#                        hydraApiKeys presented by clients (Sonarr/Radarr), plus
#                        nzbTokenSigningKey (>=32 chars) signing deterministic
#                        NZB download tokens. All three live inside this one
#                        file, so a single mounted Secret carries them.
#
# The Deployment mounts this at /config/api-keys.yaml (defaultMode 0400) and the
# app reads nzbTokenSigningKey from the mounted file -- no separate secretKeyRef
# env var is needed.
apiVersion: v1
kind: Secret
metadata:
  name: stateless-hydra-api-keys
  namespace: stateless-hydra
  labels:
    app.kubernetes.io/name: stateless-hydra
    app.kubernetes.io/component: config
type: Opaque
stringData:
  api-keys.yaml: |
    # Real upstream indexer API keys, referenced by `apiKeyRef` in
    # indexers.yaml. The CHANGE_ME placeholders below intentionally block
    # startup until replaced with the real keys.
    apiKeys:
      example_indexer_key: "CHANGE_ME"
      example_torznab_key: "CHANGE_ME"

    # Client API keys that Sonarr/Radarr present to /api. Intentionally empty:
    # this is the only authentication factor on /api, so the app fails fast at
    # startup until at least one real random key is listed here. Generate one
    # with:  openssl rand -hex 24
    hydraApiKeys: []

    # CHANGE_ME: replace with a random >=32-character secret, e.g.
    #   openssl rand -hex 32
    # It signs deterministic NZB download tokens. Deliberately <32 chars so a
    # forgotten replacement fails fast on startup instead of booting with a
    # publicly known key.
    nzbTokenSigningKey: "CHANGE_ME_BEFORE_DEPLOY"
