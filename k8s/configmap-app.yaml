# Application settings mounted into the pod at /config/app.yaml.
# Non-secret configuration lives in a ConfigMap (AGENTS.md rule 2: only
# credentials belong in a Secret; this file has none).
#
# SH_* environment variables set on the container override these values
# (standard precedence), but for redis_url prefer editing this file — the
# Deployment deliberately sets no SH_REDIS_URL, so this ConfigMap is
# authoritative.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stateless-hydra-app
  namespace: stateless-hydra
  labels:
    app.kubernetes.io/name: stateless-hydra
    app.kubernetes.io/component: config
data:
  app.yaml: |
    # stateless-hydra application settings (ConfigMap-managed).
    log_level: INFO
    user_agent: "stateless-hydra/0.1.0"

    # Point this at your Redis service (matches the Service name in
    # redis.yaml). SH_* env vars set on the Deployment WOULD override this —
    # prefer editing this file.
    redis_url: "redis://redis:6379/0"

    cache_ttl_seconds: 900
    dedupe_by_title: false
    max_results_per_indexer: 100
    global_proxy_url: null

    host: "0.0.0.0"
    port: 5076
