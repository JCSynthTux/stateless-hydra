# stateless-hydra application settings (example).
#
# In production this file is shipped as a Kubernetes ConfigMap
# (see k8s/configmap-app.yaml) and mounted read-only at /config/app.yaml.
# Every value below is the built-in default unless noted; delete a key to
# fall back to the default. Environment variables prefixed with SH_ (for
# example SH_REDIS_URL) always override values in this file.

# Log verbosity: DEBUG, INFO, WARNING, ERROR or CRITICAL.
# env: SH_LOG_LEVEL
log_level: INFO

# User-Agent sent to upstream indexers when an indexer does not override it.
# Some indexers rate-limit or block unrecognized agents.
# env: SH_USER_AGENT
user_agent: "stateless-hydra/0.1.0"

# Redis connection URL. All runtime state (search cache + daily limit
# counters) lives here; the app itself stores nothing locally. In
# Kubernetes this value lives in the ConfigMap (k8s/configmap-app.yaml) and
# should match your Redis Service name; SH_REDIS_URL env would override it.
# env: SH_REDIS_URL
redis_url: "redis://localhost:6379/0"

# Default cache TTL in seconds for indexer search responses. Individual
# indexers can override this with `cacheTtlSeconds` in indexers.yaml.
# Set to 0 to disable caching globally (or per indexer).
# env: SH_CACHE_TTL_SECONDS
cache_ttl_seconds: 900

# When true, collapse results with identical titles across indexers,
# keeping the highest-priority match. Useful to de-duplicate cross-posts.
# env: SH_DEDUPE_BY_TITLE
dedupe_by_title: false

# Maximum number of results requested from each indexer per search. Must be
# between 1 and 1000: the feed parser refuses an upstream page with more than
# 1000 items, so a higher value is rejected at startup.
# env: SH_MAX_RESULTS_PER_INDEXER
max_results_per_indexer: 100

# Hard ceiling in MiB on a single upstream response (searches, details, NZB
# payloads, and every redirect hop). Must be > 0. A larger response is
# abandoned: on a search the indexer is skipped, while details/NZB return
# Newznab error 900 (Unknown error).
# env: SH_MAX_UPSTREAM_BODY_MIB
# max_upstream_body_mib: 16

# Per-client daily envelopes over the shared per-indexer budgets. Each value
# caps how much of an indexer's daily budget one client (identified by a hash
# of its API key) may consume; the envelopes reset at 00:00 UTC. 0 means
# unlimited and writes no Redis keys. A refused search answers 910 and a
# refused download 930, exactly like an exhausted indexer.
# env: SH_PER_CLIENT_API_HIT_LIMIT
# per_client_api_hit_limit: 0
# env: SH_PER_CLIENT_NZB_PULL_LIMIT
# per_client_nzb_pull_limit: 0

# Optional global HTTP(S) proxy for all upstream indexer requests, e.g.
# "http://proxy.corp:3128" or "socks5://proxy.corp:1080". An indexer can
# override this with `proxyUrl` in indexers.yaml. Leave unset for direct.
# env: SH_GLOBAL_PROXY_URL
global_proxy_url: null

# Interface and port the HTTP server binds to (uvicorn). Port 5076 matches
# nzbhydra2's default so existing *arr client configs keep working.
# env: SH_HOST
host: "0.0.0.0"
# env: SH_PORT
port: 5076

# Optional externally reachable base URL used to build the download links
# advertised in search results, e.g. "https://hydra.example.com" behind an
# ingress. When unset, links are built from the request's Host header. This is
# a URL *prefix*: the request path (/api) is appended, so a path-bearing value
# such as "https://host/api" yields links like "https://host/api/api?...";
# prefer a host-only base. Must be absolute http(s) with a host; a query,
# fragment, userinfo or invalid port is rejected at startup.
# env: SH_PUBLIC_BASE_URL
# public_base_url: "https://hydra.example.com"

# Paths to the two other config files. Set by the container defaults / k8s
# mounts; you normally do not need to change these here.
# env: SH_APP_CONFIG
app_config: "/config/app.yaml"
# env: SH_INDEXERS_FILE
indexers_file: "/config/indexers.yaml"
# env: SH_API_KEYS_FILE
api_keys_file: "/config/api-keys.yaml"

# Secret HMAC key (>=32 characters) used to sign deterministic NZB download
# tokens. OPTIONAL override: the primary source is the `nzbTokenSigningKey`
# field of the mounted /config/api-keys.yaml secret file (see
# config/api-keys.yaml and k8s/secret-api-keys.yaml). This file ships as a
# non-secret ConfigMap in Kubernetes, so never set a real key here; setting the
# SH_NZB_TOKEN_SIGNING_KEY environment variable is the supported override for
# non-Kubernetes setups. If neither source provides a key >=32 characters the
# app fails fast at startup.
# env: SH_NZB_TOKEN_SIGNING_KEY
# nzb_token_signing_key: "CHANGE_ME_BEFORE_DEPLOY"
