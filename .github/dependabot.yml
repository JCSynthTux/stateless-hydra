version: 2
updates:
  # Keep the pinned GitHub Actions major versions up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep Python dependencies (managed by uv) up to date. uv projects are
  # supported through the standard pip ecosystem.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
