name: Publish Tag

# Manual tag path: publishes an image when a human pushes a v* tag directly
# (with a personal access token or from another workflow).
#
# The automated path lives in release.yml (main push -> semantic-release ->
# publish via job outputs). This workflow intentionally duplicates that publish
# logic instead of using a reusable workflow, to keep the two trigger paths
# simple and independent.
#
# The two paths do not double-fire:
#   * release.yml no longer listens for tag pushes at all; and
#   * the tag created by PSR inside release.yml uses the workflow's own
#     GITHUB_TOKEN, and GitHub suppresses workflow runs for such pushes — so it
#     can never trigger this workflow. Only an external actor's tag push fires
#     this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to the GitHub Container Registry.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute lowercase image name
        id: image-name
        # GHCR rejects uppercase repository names, so lowercase
        # GITHUB_REPOSITORY before use.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.image-name.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      # NOTE: pushing to GHCR requires the repository setting
      # "Workflow permissions -> Read and write" to be enabled (Settings ->
      # Actions -> General) so GITHUB_TOKEN carries packages: write.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
