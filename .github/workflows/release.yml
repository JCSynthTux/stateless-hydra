name: Release

# Automated release path, for pushes to main only.
#   * `release` runs python-semantic-release, which derives the next SemVer
#     version from the conventional-commit history on main, commits the bump,
#     creates the vX.Y.Z tag and the GitHub release, and reports the result via
#     job outputs.
#   * `publish` runs only when `release` actually made a release, checks out the
#     tag that was just created, and builds/pushes the image.
#
# Why this is a job hand-off instead of a `push: tags` trigger: GitHub
# suppresses workflow runs for pushes performed with the workflow's own
# GITHUB_TOKEN, so the tag created by PSR would NOT fire a tag-triggered
# workflow. Passing the tag through job outputs (`needs.release.outputs.tag`)
# makes the automated path work. Manually pushed tags are handled separately by
# publish-tag.yml.
#
# Why the release job does not use the official PSR action: the action runs
# `version` (bump + push commit + push tag + VCS release) as one opaque step, so
# there is no way to interpose a retry between the branch push and the tag push.
# GitHub can reject the tag push that immediately follows the branch push with
# "missing necessary objects" (the server has not yet made the new commit
# reachable for the tag). We therefore install the PSR CLI and split the flow:
# `version --no-push --no-vcs-release` -> push commit -> retry-push tag ->
# `publish` (GitHub Release).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the version-bump commit and the new tag back to main.
      contents: write
    outputs:
      # Derived from `git tag --points-at HEAD` after the local version step.
      # The downstream image job gates on `released` and checks out `tag`.
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # semantic-release needs the complete commit history and tags to
          # determine the next version from conventional commits.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-semantic-release
        # Latest 9.x, pinned for reproducibility. The official action cannot be
        # split into version/publish with custom git steps in between, so the
        # CLI is installed directly (see the header comment).
        run: python -m pip install --disable-pip-version-check "python-semantic-release==9.21.2"
      - name: Compute next version, commit and tag locally
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--no-push` keeps the bump commit + tag local so we can push them
        # ourselves (see the retry loop below); `--no-vcs-release` defers the
        # GitHub Release to the `publish` step.
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          semantic-release version --no-push --no-vcs-release
          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo "No release was made."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            tag="$(git tag --points-at HEAD | head -n1)"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "Prepared release tag ${tag} at ${after}"
          fi
      - name: Push release commit to main
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
      - name: Push release tag (retry on GitHub race)
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub sometimes rejects the tag push that immediately follows the
          # branch push with "missing necessary objects": the server has not yet
          # made the just-pushed commit reachable for the tag. Retry with a
          # short backoff instead of failing the whole release.
          for i in 1 2 3 4 5; do
            if git push origin "refs/tags/${TAG}"; then
              echo "Pushed tag ${TAG} on attempt ${i}"
              exit 0
            fi
            echo "Tag push attempt ${i} failed; retrying in 15s..."
            sleep 15
          done
          echo "Failed to push tag ${TAG} after 5 attempts" >&2
          exit 1
      - name: Publish GitHub release
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Creates the GitHub Release + notes for the (now pushed) tag.
          semantic-release publish --tag "${TAG}"

  publish:
    name: Publish image to GHCR
    needs: release
    # Only publish when semantic-release actually cut a new version.
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to the GitHub Container Registry.
      packages: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          # Build exactly the tag semantic-release created, not the bump commit.
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - name: Compute lowercase image name
        id: image-name
        # GHCR rejects uppercase repository names, so lowercase
        # GITHUB_REPOSITORY (e.g. "Owner/Repo" -> "owner/repo") before use.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: tags
        shell: bash
        # This job runs on a branch push (main), so docker/metadata-action's
        # `type=semver` cannot derive a version (it needs a tag ref). Derive the
        # explicit tags from the tag semantic-release reported instead.
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          V="${TAG#v}"
          echo "version=v${V}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action is kept ONLY for the OCI labels below. The actual
          # image tags are computed explicitly in the "Compute image tags" step
          # (semver derivation needs a tag ref, which this branch-push job lacks).
          images: ghcr.io/${{ steps.image-name.outputs.name }}
          tags: |
            type=ref,event=branch
      # NOTE: pushing to GHCR requires the repository setting
      # "Workflow permissions -> Read and write" to be enabled (Settings ->
      # Actions -> General) so GITHUB_TOKEN carries packages: write.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image-name.outputs.name }}:${{ steps.tags.outputs.version }}
            ghcr.io/${{ steps.image-name.outputs.name }}:${{ steps.tags.outputs.major_minor }}
            ghcr.io/${{ steps.image-name.outputs.name }}:${{ steps.tags.outputs.major }}
            ghcr.io/${{ steps.image-name.outputs.name }}:latest
          labels: ${{ steps.meta.outputs.labels }}
