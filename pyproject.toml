[project]
name = "stateless-hydra"
version = "0.3.2"
description = "Stateless, Kubernetes-native nzbhydra2/Newznab-compatible Usenet indexer proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx[socks]>=0.28.1",
    "lxml>=6.1.3",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateless_hydra"]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = "echo skip-build"
commit_message = "chore(release): release {version}"
# No release assets to attach/publish; keeps the pipeline from building a
# distribution for PyPI upload.
assets = []
